<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>注目銘柄 | 株ログ</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Yu Gothic",sans-serif;background:#0c121c;color:#e2ebf5;line-height:1.8}
*{box-sizing:border-box}body{margin:0;padding:28px}main{max-width:1100px;margin:auto}
header{border-bottom:1px solid #2c3c50;padding-bottom:20px;margin-bottom:24px}
.eyebrow{color:#68d8d5;font-size:13px;letter-spacing:.08em}h1{font-size:clamp(21px,4vw,30px);margin:8px 0}p{margin:8px 0;color:#a9bbce}
.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:20px 0}input{background:#152235;border:1px solid #3c5068;border-radius:8px;color:inherit;padding:10px 14px;font:inherit;width:min(100%,420px)}
.empty,article{border:1px solid #2c3c50;background:#111d2c;border-radius:12px;padding:24px;margin-bottom:16px}.empty{text-align:center;padding:40px 24px}.empty h2{font-size:19px}
.guide{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:26px}.guide section{background:#111d2c;border:1px solid #2c3c50;border-radius:10px;padding:18px}.guide h2{font-size:15px;color:#68d8d5;margin:0 0 8px}.guide p{font-size:14px}h2{margin:0 0 12px}h3{font-size:14px;color:#68d8d5;margin-bottom:4px}.note{white-space:pre-wrap;overflow-wrap:anywhere;color:#d2deeb}a{color:#68d8d5}small{color:#95a9bf}#message{color:#ffca89}
@media(max-width:640px){body{padding:18px 14px}.guide{grid-template-columns:1fr}.empty{padding:28px 18px}}
</style>
<main>
<header><div class="eyebrow">個人的メモ / 手動更新</div><h1>注目銘柄</h1><p>個別企業の事業・変化・価格から、気になっている銘柄を整理する。</p><small>株ログに掲載するメモは公開されます。余白のローカルTODOとは別の保存先です。</small></header>
<div class="toolbar"><input id="search" type="search" aria-label="銘柄・メモを検索" placeholder="銘柄名・コード・メモで検索"><span id="count" role="status">読込中…</span></div>
<p id="message" role="alert" hidden></p><div id="items"></div>
<div class="guide">
<section><h2>本人のメモ・原文</h2><p>気になった理由や着眼点を、原文のまま残します。</p></section>
<section><h2>確認できた事実・出典</h2><p>決算・開示・企業情報など、確認日と情報源を添えて記録します。</p></section>
<section><h2>仮説・次に確認すること</h2><p>AIの整理や予想は仮説として分け、未確認の点を残します。</p></section>
</div>
</main>
<script>
'use strict';
let items=[];
const list=document.getElementById('items'), search=document.getElementById('search');
function element(tag,text,cls){const el=document.createElement(tag);el.textContent=text;if(cls)el.className=cls;return el;}
function render(){
 const query=search.value.trim().toLocaleLowerCase('ja');
 const visible=items.filter(item=>[item.code,item.name,item.approach,item.theme,item.original_note,item.bullish,item.bearish,item.facts,item.hypothesis,item.next_check].join(' ').toLocaleLowerCase('ja').includes(query));
 document.getElementById('count').textContent=visible.length+'件 / 登録 '+items.length+'件';
 list.replaceChildren();
 if(!visible.length){const empty=element('section','','empty');empty.append(element('h2',items.length?'一致する銘柄はありません':'注目銘柄はまだ登録されていません'),element('p',items.length?'検索する言葉を変えてください。':'銘柄が決まったら、銘柄名と気になった理由をここに記録していきます。'));list.append(empty);return;}
 const approaches=[...new Set(visible.map(item=>item.approach||'未分類'))];
 for(const approach of approaches){list.append(element('h2',approach));
 for(const item of visible.filter(item=>(item.approach||'未分類')===approach)){const card=element('article','');card.append(element('h2',[item.code,item.name].filter(Boolean).join(' ')));
 if(item.approach)card.append(element('p',[item.approach,item.theme].filter(Boolean).join(' / ')));
 if(item.recorded_at)card.append(element('p','過去メモの記録日：'+item.recorded_at+'（現在の事実確認日ではありません）'));
 for(const [key,label] of [['original_note','過去メモの記載'],['bullish','強気な理由（本人の見解・予想）'],['bearish','弱気な理由（本人の見解）'],['facts','確認できた事実'],['hypothesis','仮説・AIの整理'],['next_check','次に確認すること']]){if(['original_note','hypothesis'].includes(key)&&!item[key])continue;card.append(element('h3',label),element('p',item[key]||'未記入','note'));}
 if(item.source_note)card.append(element('p','記録元：'+item.source_note));
 if(item.source_url){try{const url=new URL(item.source_url);if(['https:','http:'].includes(url.protocol)){const link=element('a','出典を開く ↗');link.href=url.href;link.target='_blank';link.rel='noopener noreferrer';card.append(link);}}catch{}}
 if(item.checked_at)card.append(element('p','確認日：'+item.checked_at));list.append(card);}}
}
search.addEventListener('input',render);
fetch('./data_personal/bottom-up.json').then(response=>{if(!response.ok)throw Error('read');return response.json();}).then(data=>{if(!Array.isArray(data.items))throw Error('format');items=data.items;render();}).catch(()=>{document.getElementById('count').textContent='取得できませんでした';const message=document.getElementById('message');message.hidden=false;message.textContent='メモを読み込めませんでした。ページを再読み込みしてください。';});
</script>
</html>
